name: Synchroniser les articles Substack

on:
  schedule:
    # 4 fois par jour (heures UTC)
    - cron: "23 5,11,17,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Télécharger le flux RSS (comme un navigateur)
        run: |
          curl -fsSL --retry 3 --retry-delay 5 \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/126.0.0.0 Safari/537.36" \
            -H "Accept: application/rss+xml,application/xml;q=0.9,*/*;q=0.8" \
            -H "Accept-Language: fr-FR,fr;q=0.9,en;q=0.8" \
            "https://komunemedia.substack.com/feed" -o /tmp/feed.xml || true

      - name: Mettre à jour data/articles.json depuis le flux RSS
        run: python3 scripts/sync_substack.py /tmp/feed.xml

      - name: Publier si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json
          if git diff --cached --quiet; then
            echo "Rien de nouveau côté Substack."
          else
            git commit -m "maj automatique des articles depuis Substack"
            git push
          fi
