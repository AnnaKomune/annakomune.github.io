name: Synchroniser les articles Substack

on:
  schedule:
    # 8 fois par jour (heures UTC)
    - cron: "23 2,5,8,11,14,17,20,23 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le site
        uses: actions/checkout@v4

      - name: Installer curl_cffi (empreinte navigateur pour passer Cloudflare)
        run: pip install --quiet curl_cffi

      - name: Mettre à jour les articles et la page /articles/ depuis Substack
        run: |
          # Substack et les relais publics refusent regulierement les adresses IP
          # des serveurs GitHub. L'echec est presque toujours passager : on retente
          # trois fois, a deux minutes d'intervalle, avant d'abandonner.
          for essai in 1 2 3; do
            if python3 scripts/sync_substack.py; then
              exit 0
            fi
            echo "Tentative $essai sans succes."
            if [ "$essai" != "3" ]; then
              echo "Nouvelle tentative dans 120 secondes."
              sleep 120
            fi
          done
          echo "::error::Substack reste injoignable apres trois tentatives."
          exit 1

      - name: Publier si quelque chose a changé
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/articles.json articles/index.html sitemap.xml
          if git diff --cached --quiet; then
            echo "Rien de nouveau côté Substack."
          else
            git commit -m "maj automatique des articles depuis Substack"
            git push
          fi
